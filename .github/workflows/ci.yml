name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ios-dylib:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Install packaging tools
        run: |
          if ! command -v dpkg-deb >/dev/null 2>&1; then brew install dpkg; fi
          if ! command -v rg >/dev/null 2>&1; then brew install ripgrep; fi
      - name: Run core tests
        run: make test
      - name: Build release artifacts
        run: |
          make release 2>&1 | tee /tmp/build.log || {
            echo "::error::Build release failed! Full log follows:"
            cat /tmp/build.log
            exit 1
          }
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IsaacSteamSynciOS-${{ github.ref_name }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/IsaacSteamSynciOS.dylib
            dist/IsaacSteamSynciOS-rootless.deb
            dist/SHA256SUMS
          retention-days: 14
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.3-touchmod
          name: "IsaacSteamSynciOS v1.2.3-touchmod"
          files: |
            dist/IsaacSteamSynciOS.dylib
            dist/IsaacSteamSynciOS-rootless.deb
            dist/SHA256SUMS
